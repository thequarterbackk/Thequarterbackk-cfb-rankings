name: Update rankings and maps

on:

  workflow_dispatch:

  push:

    branches: ["main"]

    paths:

      - "update_rankings.py"

      - "model_core.py"

      - "test_*.py"

      - ".github/workflows/update-rankings.yml"

  schedule:

    - cron: "17 * * * *"

permissions:

  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Verify ranking rules

        run: python -m unittest -v test_rankings.py test_model_core.py

      - name: Update rankings

        env:

          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

        run: python update_rankings.py

      - name: Commit updated data

        run: |

          git config user.name "CFB Rankings Bot"

          git config user.email "actions@github.com"

          git add data.json model_predictions.json market_closing_lines.json team_logos/

          if git diff --cached --quiet; then

            echo "No data changes."

          else

            git commit -m "Auto-update CFB rankings"

            git push

          fi


